<svg width="200" height="54" viewBox="0 0 200 54" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="200" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E1322"/>
      <stop offset="100%" stop-color="#080C16"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0" y1="0" x2="200" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Icon Gradient -->
    <linearGradient id="iconGrad" x1="12" y1="9" x2="48" y2="45" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>

    <!-- Icon Glow Filter -->
    <filter id="iconShadow" x="8" y="7" width="44" height="44" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0284C7" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="0.5" y="0.5" width="199" height="53" rx="12" fill="url(#bgGrad)" stroke="url(#borderGrad)"/>

  <!-- Left Icon Tile (macOS Squircle style) -->
  <g filter="url(#iconShadow)">
    <rect x="12" y="9" width="36" height="36" rx="9" fill="url(#iconGrad)"/>
    <rect x="12.5" y="9.5" width="35" height="35" rx="8.5" stroke="#FFFFFF" stroke-opacity="0.25"/>
    
    <!-- Stylized Mac Display with Checkmark -->
    <rect x="19" y="16" width="22" height="15" rx="2" fill="#FFFFFF" fill-opacity="0.15" stroke="#FFFFFF" stroke-width="1.2"/>
    <path d="M27 31V34M24 34H36" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M25 23.5L28 26.5L35 19.5" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Content Text -->
  <!-- Overline: FEATURED ON -->
  <text x="58" y="21" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', sans-serif" font-size="9" font-weight="600" letter-spacing="0.08em">FEATURED ON</text>

  <!-- Primary Wordmark: PickMacApps -->
  <text x="58" y="38" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', sans-serif" font-size="15" font-weight="700" letter-spacing="-0.02em">
    <tspan fill="#F8FAFC">Pick</tspan><tspan fill="#38BDF8">Mac</tspan><tspan fill="#F8FAFC">Apps</tspan>
  </text>

  <!-- Right Accent Chevron -->
  <path d="M185 24L188 27L185 30" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.75"/>
</svg>
